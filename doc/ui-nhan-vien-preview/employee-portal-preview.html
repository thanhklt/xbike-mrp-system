<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#100d0b" />
  <meta name="description" content="XBIKE MRP System - Cổng nhân viên kho và sản xuất" />
  <title>XBIKE MRP | Cổng nhân viên</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #100d0b;
  --sidebar: #1b120e;
  --surface: #1c1816;
  --surface-2: #211b18;
  --surface-3: #2a211b;
  --line: #352820;
  --line-soft: #2a211d;
  --text: #f7f2ee;
  --muted: #b6a197;
  --subtle: #8b786d;
  --accent: #ee690d;
  --accent-hover: #ff7c22;
  --accent-dim: #40220f;
  --green: #74c997;
  --green-bg: #20392b;
  --gold: #ecc078;
  --gold-bg: #45331a;
  --red: #ef8585;
  --red-bg: #452525;
  --radius: 12px;
}
* { box-sizing: border-box; }
html { min-height: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 'Segoe UI', Inter, Arial, sans-serif; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: inherit; }
svg.icon { display: inline-block; width: 17px; height: 17px; flex: 0 0 auto; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.hidden { display: none !important; }
.app-shell { display: flex; min-height: 100vh; }
.sidebar { position: fixed; z-index: 30; width: 235px; height: 100dvh; left: 0; top: 0; overflow: hidden; background: var(--sidebar); border-right: 1px solid #30241e; display: flex; flex-direction: column; }
.brand-area { height: 96px; flex: 0 0 96px; padding: 14px 34px; background: radial-gradient(ellipse at 30% 15%, #37261d 0%, #20150f 64%, #1c130f 100%); }
.brand-logo { display: inline-block; font-family: Arial Black, Impact, Arial, sans-serif; font-weight: 1000; letter-spacing: -2.8px; font-size: 37px; line-height: 1; font-style: italic; transform: skew(-9deg); text-shadow: 0 2px 2px #1a0c07; }
.brand-subline { font-size: 12px; font-weight: 800; letter-spacing: 3.2px; margin-left: 11px; margin-top: 2px; white-space: nowrap; }
.brand-trademark { vertical-align: super; font-size: 7px; letter-spacing: 0; }
.nav-menu { padding: 37px 11px 8px; z-index: 2; display: flex; flex-direction: column; gap: 5px; }
.nav-item { border: 0; display: flex; align-items: center; gap: 14px; text-align: left; min-height: 47px; border-radius: 8px; padding: 0 14px; font-weight: 600; color: #dfd1c8; background: transparent; width: 100%; transition: background .17s, color .17s; white-space: nowrap; }
.nav-item svg { width: 18px; height: 18px; }
.nav-item.active { color: #fff; background: #df5f04; }
.nav-item:hover:not(.active) { background: #36231b; }
.nav-counter { margin-left: auto; background: #493026; color: #e8bd93; padding: 0px 6px; font-size: 11px; border-radius: 3px; line-height: 17px; }

.sidebar-photo::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, #1b120e 0%, rgba(27,18,14,.92) 8%, rgba(27,18,14,.1) 34%, transparent 66%); }
.sidebar-mobile-footer { display:none; }
.main-frame { margin-left: 235px; width: calc(100% - 235px); min-width: 0; }
.topbar { min-height: 48px; height: 48px; border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; align-items: center; padding: 0 33px; }
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 17px; }
.topbar-left { color: #d6c9bd; }
.breadcrumb-home { color: #d8ae7b; }
.breadcrumb-home svg { width: 15px; height:15px; }
.breadcrumb-chevron { width: 14px !important; height: 14px !important; color: #a58f7c; }
.module-pill { border: 1px solid #453023; border-radius: 4px; padding: 4px 10px; font-size: 11px; color:#d9b99c; margin-right: 13px; }
.profile-button { background: transparent; border:0; display:flex; align-items:center; gap:12px; color:var(--text); padding:4px 0; }
.avatar { width: 39px; height:39px; border-radius:50%; display:grid; place-items:center; background:#553624; border:1px solid #a05a30; font-weight:700; color:#ffe3bd; }
.profile-copy { min-width: 125px; text-align:left; display:flex; flex-direction:column; line-height:1.55; }
.profile-copy strong { font-size:12px; font-weight:700; }
.profile-copy small { font-size:10px; color:#d5ad8b; }
.profile-button .icon { width:15px; height:15px; color:#ab9585; }
.profile-menu { position:absolute; z-index:100; top:51px; right:25px; width:250px; border:1px solid var(--line); border-radius:9px; background:#24201e; padding:17px; box-shadow:0 18px 48px #0007; display:flex; flex-direction:column; }
.profile-menu small { color:var(--muted); margin-top:3px; }
.profile-menu p { color:var(--subtle); border-top:1px solid var(--line); padding-top:12px; margin-bottom:0; }
.main-content { padding: 29px 33px 60px; margin:0 auto; max-width: 1830px; }
.page-heading { display:flex; justify-content:space-between; align-items:center; gap:18px; margin-bottom:26px; }
.page-heading h1 { font-size:24px; font-weight:750; margin:0 0 2px; letter-spacing:-.7px; }
.page-heading p { margin:0; font-size:13px; color:#e4c2a5; }
.page-actions { display:flex; gap:22px; align-items:center; white-space:nowrap; }
.date-label { display:flex; align-items:center; gap:9px; color:#d8c0b0; font-size:12px; }
.date-label svg { width:16px; height:16px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:9px; min-height:39px; padding: 0 16px; border-radius:6px; background:var(--surface-3); color:var(--text); border:1px solid #4c3528; font-weight:650; line-height:1.2; transition:transform .15s, background .15s; }
.btn:hover { background:#3b2b24; }
.btn:active { transform:translateY(1px); }
.btn-primary { background:var(--accent); color:#fff; border-color:#f68437; }
.btn-primary:hover { background:var(--accent-hover); }
.btn-secondary { background:transparent; color:#f0c097; border-color:#5b3822; }
.btn-ghost { background:transparent; border-color:transparent; color:#eab289; padding:0 8px; }
.btn-ghost:hover { background:#32241b; }
.btn-small { min-height:32px; font-size:12px; padding:0 11px; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.icon-button { display:grid; place-items:center; background:transparent; border:0; color:var(--muted); width:30px; height:30px; border-radius:6px; }
.icon-button:hover { background:#34251c; }
.mobile-menu-button { display:none; }
.stats-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:21px; }
.stat-card { background:var(--surface); border:1px solid var(--line); border-radius:11px; min-height:136px; padding:20px 23px 17px; position:relative; text-align:left; color:var(--text); width:100%; }
.stat-card:hover { border-color:#875032; background:#211b17; }
.stat-card-label { display:block; color:#e8c4a8; font-size:13px; font-weight:600; margin-bottom:5px; }
.stat-card-number { font-size:37px; line-height:1.12; letter-spacing:-1px; font-weight:700; display:block; }
.stat-card-desc { display:block; color:#c39976; font-size:11px; margin-top:8px; }
.stat-card-icon { position:absolute; right:23px; top:22px; color:#b99476; }
.stat-card-icon svg { width:18px; height:18px; }
.stat-card-arrow { position:absolute; right:23px; top:63px; color:#a28d7b; }
.stat-card-arrow svg { width:16px; height:16px; }
.dashboard-grid { display:grid; grid-template-columns:minmax(0,3.07fr) minmax(255px,.77fr); gap:20px; align-items:start; }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; min-width:0; overflow:hidden; }
.panel-head { padding:20px 20px 0; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.panel-title { display:flex; gap:8px; align-items:center; margin:0; font-size:16px; font-weight:700; }
.panel-kicker { color:#cdb19d; font-size:11px; margin:4px 0 0; }
.count-box { font-size:11px; line-height:19px; background:#3b2a20; color:#dbb48e; border:1px solid #533a2b; border-radius:4px; padding:0px 6px; }
.text-link { border:0; background:transparent; color:#d8ab85; display:flex; gap:5px; align-items:center; white-space:nowrap; font-size:11px; margin-top:14px; }
.text-link:hover,.table-action:hover { color:#ff9e51; }
.text-link svg { width:13px; height:13px; }
.tabs { display:flex; gap:19px; padding:21px 20px 0; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:thin; }
.tab { background:transparent; border:0; border-bottom:2px solid transparent; color:#bca794; padding:0 0 11px; white-space:nowrap; font-size:11px; }
.tab.active { color:#fff3ea; border-bottom-color:var(--accent); font-weight:700; }
.tab:hover:not(.active) { color:#f2d5c0; }
.data-table-wrap { overflow-x:auto; }
.data-table { width:100%; border-collapse:collapse; text-align:left; }
.data-table th { font-weight:500; font-size:10px; color:#c8a88f; white-space:nowrap; background:rgba(17,13,12,.06); padding:8px 20px 10px; }
.data-table td { border-top:1px solid #332922; padding:14px 20px; vertical-align:middle; }
.data-table td:first-child { min-width:220px; }
.data-table .right { text-align:right; }
.data-table .center { text-align:center; }
.row-title { font-size:11.5px; color:#f2b98e; font-weight:700; display:block; border:0; padding:0; background:none; text-align:left; }
.row-title:hover { text-decoration:underline; }
.row-subtitle { font-size:10.5px; display:block; color:#e2c4b1; margin-top:4px; }
.qty-main { display:block; font-size:13px; color:#fff; font-weight:650; line-height:1.3; }
.qty-unit { color:#c7aa91; font-size:10.5px; }
.status { display:inline-flex; align-items:center; gap:6px; padding:4px 7px; border-radius:4px; line-height:1.15; white-space:nowrap; font-size:10.5px; font-weight:650; }
.status::before { content:''; width:5px; height:5px; border-radius:100%; background:currentColor; }
.status-ready,.status-approved,.status-done { background:var(--green-bg); color:#9cdfb5; }
.status-progress { background:#4c2b16; color:#ffb36f; }
.status-material,.status-pending { background:var(--gold-bg); color:#e9bb6a; }

function documentOrder(doc) {
  // Older demo documents only stored a request ID. Use its first batch.
  return productionOrders.find(order => doc.orderId ? order.id===doc.orderId : order.requestId===doc.requestId);
}

function orderSummary(order) {
  const docs=state.docs.filter(doc=>documentOrder(doc)===order);
  const approved=docs.filter(doc=>doc.status==='approved').reduce((sum,doc)=>sum+doc.qty,0);
  const pending=docs.filter(doc=>doc.status==='pending').reduce((sum,doc)=>sum+doc.qty,0);
  const stage=order.waitingMaterials?'material':approved>=order.planned?'done':approved+pending>=order.planned?'pending':'progress';
  return {stage,approved,pending,docs};
}

  const query=state.search.trim().toLowerCase();

    const request=getRequest(order.requestId);

    if(state.filter!=='all'&&stage!==state.filter)return [];
    if(!`${order.id} ${request.id} ${request.product} ${request.sku}`.toLowerCase().includes(query))return [];
    const recorded=approved+pending;
    return `<tr><td><button class="row-title" data-action="detail-order" data-id="${order.id}">${order.id}</button><span class="row-subtitle">${request.id}</span></td>
      <td>${escapeHTML(request.product)}<span class="row-subtitle">${request.sku}</span></td>

  return `${header('Lệnh sản xuất','Theo dõi kế hoạch, sản lượng ghi nhận và trạng thái của từng lệnh.')}
    <section class="stats-grid order-stats" aria-label="Thống kê lệnh sản xuất">${cards}</section>
    <section class="panel page-panel"><div class="panel-head"><div><h2 class="panel-title">Danh sách lệnh sản xuất <span class="count-box">${productionOrders.length}</span></h2><p class="panel-kicker">Sản lượng ghi nhận gồm sản phẩm đạt trên chứng từ đã duyệt và đang chờ duyệt.</p></div></div>
      <div class="page-tools"><label class="searchbox">${icon('search')}<input data-search="orders" aria-label="Tìm lệnh sản xuất" placeholder="Tìm mã lệnh, yêu cầu, thành phẩm..." value="${escapeHTML(state.search)}"></label>
      <select class="select" data-filter="orders" aria-label="Trạng thái lệnh sản xuất"><option value="all">Tất cả trạng thái</option>${options}</select></div>
      <div class="data-table-wrap order-table-wrap" tabindex="0" role="region" aria-label="Bảng lệnh sản xuất"><table class="data-table">
      <thead><tr><th>Lệnh / Yêu cầu</th><th>Thành phẩm</th><th>Ghi nhận / Kế hoạch</th><th>Hạn hoàn thành</th><th>Trạng thái</th><th class="right">Thao tác</th></tr></thead><tbody id="orderTableBody">${orderRows()}</tbody></table></div>
    </section>`;
}

function setOrderFilter(filter) {
  state.filter=filter;
  document.querySelector('[data-filter="orders"]').value=filter;
  document.querySelectorAll('[data-order-filter]').forEach(card=>card.setAttribute('aria-pressed',String(card.dataset.orderFilter===filter)));
  updateVisibleTable();
}

function orderDetail(id) {
  const order=productionOrders.find(item=>item.id===id);
  if(!order)return;
  const request=getRequest(order.requestId);
  const {stage,approved,pending,docs}=orderSummary(order);
  const body=`<div class="detail-grid">
    ${detailItem('Yêu cầu sản xuất',`<button class="row-title" data-action="detail-request" data-id="${request.id}">${request.id}</button>`)}
    ${detailItem('Trạng thái',statusBadge(stage,orderStages[stage].label))}
    ${detailItem('Hạn hoàn thành',fmtDate(order.due))}
    ${detailItem('Sản lượng kế hoạch',fmt(order.planned)+' chiếc')}
    ${detailItem('Sản lượng đã duyệt',fmt(approved)+' chiếc')}
    ${detailItem('Sản lượng chờ duyệt',fmt(pending)+' chiếc')}
    </div><div class="detail-section"><h3>Chứng từ hoàn thành</h3>
    ${docs.length?`<ul class="order-links">${docs.map(doc=>`<li><button class="row-title" data-action="detail-document" data-id="${escapeHTML(doc.id)}">${escapeHTML(doc.id)}</button>${docStatus(doc.status)}</li>`).join('')}</ul>`:'<p>Chưa có chứng từ cho lệnh này.</p>'}</div>`;
  const footer=`<button class="btn btn-secondary" data-action="close-modal">Đóng</button>${stage==='progress'?`<button class="btn btn-primary" data-action="create-document" data-id="${order.id}">${icon('plus',15)} Tạo chứng từ hoàn thành</button>`:''}`;
  openModal('Chi tiết lệnh sản xuất',`${order.id} · ${escapeHTML(request.product)}`,body,footer);
}

function render() {
  document.getElementById('breadcrumb').textContent=pageNames[state.page];
  document.querySelectorAll('.nav-item').forEach(b=>{const selected=b.dataset.page===state.page;b.classList.toggle('active',selected);if(selected)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  document.getElementById('navRequestCount').textContent=requests.length;
  const main=document.getElementById('mainContent');
  main.innerHTML=({overview,requests:requestsPage,orders:ordersPage,documents:documentsPage,outbounds:outboundsPage,inventory:inventoryPage}[state.page])();
  document.title = `${pageNames[state.page]} | XBIKE MRP`;
}
function navigate(page) { if(!pageNames[page])return;state.page=page;state.tab='all';state.filter='all';state.search='';render();closeMobile();window.scrollTo({top:0,behavior:'smooth'}); }
function closeMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobileBackdrop').classList.remove('show');
  document.getElementById('menuToggle').setAttribute('aria-expanded','false');
}
function setTab(tab) {state.tab=tab;render();}
function updateVisibleTable() {
  if(state.page==='orders'){
    document.getElementById('orderTableBody').innerHTML=orderRows();
    return;
  }
  const tbody=document.querySelector('#requestTableBody,#documentTableBody,#outboundTableBody,#inventoryTableBody');if(!tbody)return;if(state.page==='requests'||state.page==='overview')tbody.innerHTML=requestRows(filteredRequests(state.tab,state.search));if(state.page==='documents')tbody.innerHTML=documentTable(filterDocs()).match(/<tbody[^>]*>([\s\S]*?)<\/tbody>/)?.[1]||'';if(state.page==='outbounds')tbody.innerHTML=outboundTable(filterOutbounds()).match(/<tbody[^>]*>([\s\S]*?)<\/tbody>/)?.[1]||'';if(state.page==='inventory')tbody.innerHTML=inventoryRows();}
function showToast(message,error=false){const wrap=document.getElementById('toastStack');const el=document.createElement('div');el.className='toast'+(error?' error':'');el.innerHTML=`${icon(error?'alert-triangle':'check-circle',18)} <span>${escapeHTML(message)}</span>`;wrap.appendChild(el);setTimeout(()=>el.remove(),4200);}
function openModal(title,subtitle,content,footer='') {
  const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-overlay" id="modalOverlay"><section role="dialog" aria-modal="true" aria-labelledby="modalTitle" class="modal"><div class="modal-header"><div><h2 id="modalTitle">${title}</h2><p>${subtitle||''}</p></div><button class="icon-button" data-action="close-modal" aria-label="Đóng">${icon('x',19)}</button></div><div class="modal-body">${content}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</section></div>`;
  document.body.style.overflow='hidden';root.querySelector('.icon-button')?.focus();
}
function closeModal() {document.getElementById('modalRoot').innerHTML='';document.body.style.overflow='';}
function detailItem(k,v) {return `<div class="detail-item"><small>${escapeHTML(k)}</small><strong>${v}</strong></div>`;}
function requestDetail(id) {
  const r=getRequest(id);if(!r)return;const stage=effectiveStage(r);
  const orders=productionOrders.filter(order=>order.requestId===id);
  const orderLinks=orders.length?`<div class="detail-section"><h3>Lệnh sản xuất liên quan</h3><ul class="order-links">${orders.map(order=>`<li><button class="row-title" data-action="detail-order" data-id="${order.id}">${order.id}</button></li>`).join('')}</ul></div>`:'';
  const detail=`<div class="detail-grid">${detailItem('Mã yêu cầu',r.id)}${detailItem('Tiến độ',statusBadge(stage))}${detailItem('Số lượng yêu cầu',fmt(r.qty)+' chiếc')}${detailItem('Tồn kho hiện có',fmt(r.stock)+' chiếc')}${detailItem('Mã hàng',r.sku)}${detailItem('Tuyến xử lý',escapeHTML(r.route))}</div>
  ${orderLinks}<div class="detail-section"><h3>Ghi chú xử lý</h3><p>${escapeHTML(stage==='outbound'?'Phiếu xuất đã được gửi duyệt. Nhân viên cần theo dõi kết quả từ quản lý.':r.note)}</p></div>
  <div class="detail-section"><h3>Luồng công việc</h3><div class="steps"><div class="step done"><span class="step-dot">${icon('check',11)}</span><span><b>Hệ thống tiếp nhận yêu cầu</b><small>Yêu cầu được phân công cho nhân viên</small></span></div><div class="step ${r.stock>=r.qty?'done':''}"><span class="step-dot">${r.stock>=r.qty?icon('check',11):'2'}</span><span><b>Kiểm tra tồn kho / sản xuất</b><small>${r.stock>=r.qty?'Đủ số lượng theo yêu cầu':'Chưa đủ số lượng thành phẩm · Cần xử lý theo BOM'}</small></span></div><div class="step ${stage==='outbound'?'done':''}"><span class="step-dot">${stage==='outbound'?icon('check',11):'3'}</span><span><b>Lập phiếu xuất thành phẩm</b><small>${stage==='outbound'?'Đã gửi duyệt':'Chỉ thực hiện khi đáp ứng đủ điều kiện'}</small></span></div><div class="step"><span class="step-dot">4</span><span><b>Quản lý phê duyệt và xác nhận xuất kho</b><small>Chưa hoàn tất</small></span></div></div></div>
  ${r.materials.length?`<div class="detail-section"><h3>Vật tư theo BOM (tham khảo)</h3><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Nguyên vật liệu</th><th class="right">Định mức cần</th></tr></thead><tbody>${r.materials.map(([n,q])=>`<tr><td>${escapeHTML(n)}</td><td class="right">${q}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;
  const footer=`<button class="btn btn-secondary" data-action="close-modal">Đóng</button>${stage==='ready'?`<button class="btn btn-primary" data-action="create-issue" data-id="${r.id}">${icon('plus',15)} Tạo phiếu xuất</button>`:''}`;
  openModal('Chi tiết yêu cầu sản xuất',escapeHTML(r.product),detail,footer);
}
function issueModal(id) {
  const eligible=readyRequests();if(!eligible.length){showToast('Không còn yêu cầu đủ điều kiện lập phiếu xuất.',true);return;}
  const r=eligible.find(r=>r.id===id)||eligible[0];
  const options=eligible.map(item=>`<option value="${item.id}" ${item.id===r.id?'selected':''}>${item.id} — ${escapeHTML(item.product)}</option>`).join('');
  const body=`<div class="inline-info">${icon('info',17)} Phiếu xuất chỉ được gửi duyệt khi thành phẩm có đủ tồn kho khả dụng. Đây là quy trình minh họa, không tự động thay đổi tồn kho.</div>
    <form id="issueForm"><div class="form-grid"><div class="form-field span-2"><label for="issueRequest">Yêu cầu sản xuất <em>*</em></label><select id="issueRequest" name="requestId" required>${options}</select></div>
    <div class="form-field"><label for="issueProduct">Thành phẩm</label><input id="issueProduct" value="${escapeHTML(r.product)}" readonly /></div>
    <div class="form-field"><label for="issueSku">Mã hàng</label><input id="issueSku" value="${r.sku}" readonly /></div>
    <div class="form-field"><label for="issueAvail">Tồn kho khả dụng</label><input id="issueAvail" value="${fmt(r.stock)} chiếc" readonly /></div>
    <div class="form-field"><label for="issueQty">Số lượng xuất <em>*</em></label><input id="issueQty" name="qty" type="number" min="1" max="${r.qty}" value="${r.qty}" readonly /><small class="form-hint">Theo đúng số lượng yêu cầu đã giao</small></div>
    <div class="form-field span-2"><label for="issueNote">Ghi chú</label><textarea id="issueNote" name="note" maxlength="500" placeholder="Thông tin bổ sung cho quản lý..."></textarea></div></div></form>`;
  const footer=`<button class="btn btn-secondary" data-action="close-modal">Hủy</button><button class="btn btn-primary" type="submit" form="issueForm">${icon('file-check',15)} Gửi phiếu chờ duyệt</button>`;
  openModal('Tạo phiếu xuất thành phẩm',`Phân hệ kho · ${r.id}`,body,footer);
}
function createIssue(form) {
  const fd=new FormData(form),id=fd.get('requestId'),r=getRequest(id);
  if(!r||!isReady(r)){showToast('Yêu cầu không còn đủ điều kiện xuất.',true);return;}
  const qty=Number(fd.get('qty'));
  if(!Number.isInteger(qty)||qty!==r.qty||qty>r.stock){showToast('Số lượng xuất phải bằng số lượng yêu cầu và không vượt tồn kho.',true);return;}
  const now = new Date().toISOString().slice(0,10);
  const newItem={id:makeId('PXT'),requestId:r.id,product:r.product,sku:r.sku,qty,date:now,status:'pending',note:String(fd.get('note')||'').trim().slice(0,500)};
  state.outbounds.push(newItem);saveStorage('xbike_outbounds_v1',state.outbounds);closeModal();render();showToast(`Đã tạo phiếu ${newItem.id} và chuyển sang chờ duyệt (demo).`);
}
function documentModal(id) {
  const eligible=productionOrders.filter(order=>orderSummary(order).stage==='progress');
  const selected=id?eligible.find(order=>order.id===id):eligible[0];
  if(!selected){showToast('Không có lệnh sản xuất cần ghi nhận sản lượng.',true);return;}
  const opts=eligible.map(order=>`<option value="${order.id}" ${order===selected?'selected':''}>${order.id} — ${escapeHTML(getRequest(order.requestId).product)} · ${order.requestId}</option>`).join('');
  const body=`<div class="inline-info">${icon('info')} Nhân viên chỉ ghi nhận sản lượng thực tế. Nhập kho thành phẩm phải được quản lý duyệt/xác nhận riêng.</div><form id="documentForm"><div class="form-grid"><div class="form-field span-2"><label for="docRequest">Lệnh sản xuất <em>*</em></label><select id="docRequest" name="orderId" required>${opts}</select></div>
  <div class="form-field"><label for="docGood">Sản phẩm đạt <em>*</em></label><input id="docGood" name="qty" type="number" min="1" max="10000" value="1" required /></div><div class="form-field"><label for="docBad">Sản phẩm lỗi</label><input id="docBad" name="badQty" type="number" min="0" max="10000" value="0" required /></div>
  <div class="form-field span-2"><label for="docNote">Ghi chú sản xuất</label><textarea id="docNote" name="note" maxlength="500" placeholder="Ca sản xuất, kết quả kiểm tra, ghi chú..."></textarea></div></div></form>`;
  openModal('Tạo chứng từ hoàn thành',selected.id,body,`<button class="btn btn-secondary" data-action="close-modal">Hủy</button><button type="submit" form="documentForm" class="btn btn-primary">${icon('file-check',15)} Gửi chứng từ chờ duyệt</button>`);
}
function createDocument(form){
  const fd=new FormData(form);
  const order=productionOrders.find(item=>item.id===fd.get('orderId'));
  const qty=Number(fd.get('qty')),badQty=Number(fd.get('badQty'));
  if(!order||orderSummary(order).stage!=='progress'||!Number.isInteger(qty)||qty<1||qty>10000||!Number.isInteger(badQty)||badQty<0||badQty>10000){showToast('Vui lòng kiểm tra số lượng và lệnh sản xuất.',true);return;}
  const r=getRequest(order.requestId);
  const now=new Date().toISOString().slice(0,10);const d={id:makeId('CTHT'),orderId:order.id,requestId:r.id,product:r.product,qty,badQty,date:now,status:'pending',note:String(fd.get('note')||'').trim().slice(0,500)};
  state.docs.push(d);saveStorage('xbike_docs_v1',state.docs);closeModal();render();showToast(`Đã tạo chứng từ ${d.id} ở trạng thái chờ duyệt (demo).`);
}
function documentDetail(id) {
  const d=state.docs.find(x=>x.id===id);if(!d)return;
  const order=documentOrder(d);
  const orderLink=order?detailItem('Lệnh sản xuất',`<button class="row-title" data-action="detail-order" data-id="${order.id}">${order.id}</button>`):'';
  const body=`<div class="detail-grid">${detailItem('Mã chứng từ',escapeHTML(d.id))}${detailItem('Trạng thái',docStatus(d.status))}${detailItem('Yêu cầu sản xuất',escapeHTML(d.requestId))}${detailItem('Ngày lập',fmtDate(d.date))}${detailItem('Số lượng đạt',`${fmt(d.qty)} chiếc`)}${detailItem('Số lượng lỗi',`${fmt(d.badQty||0)} chiếc`)}${orderLink}</div><div class="detail-section"><h3>Thành phẩm</h3><p>${escapeHTML(d.product)}</p></div><div class="detail-section"><h3>Ghi chú</h3><p>${escapeHTML(d.note||'Không có ghi chú.')}</p></div>`;
  openModal('Chi tiết chứng từ hoàn thành',d.id,body,`<button class="btn btn-secondary" data-action="close-modal">Đóng</button>`);
}
function outboundDetail(id){
  const o=state.outbounds.find(x=>x.id===id);if(!o)return;
  const body=`<div class="detail-grid">${detailItem('Mã phiếu xuất',escapeHTML(o.id))}${detailItem('Trạng thái',docStatus(o.status))}${detailItem('Yêu cầu sản xuất',escapeHTML(o.requestId))}${detailItem('Ngày lập',fmtDate(o.date))}${detailItem('Mã thành phẩm',escapeHTML(o.sku||'—'))}${detailItem('Số lượng xuất',`${fmt(o.qty)} chiếc`)}</div><div class="detail-section"><h3>Thành phẩm</h3><p>${escapeHTML(o.product)}</p></div><div class="detail-section"><h3>Ghi chú</h3><p>${escapeHTML(o.note||'Phiếu xuất đang chờ quản lý duyệt.')}</p></div><div class="inline-info" style="margin-top:18px;margin-bottom:0">${icon('clock')} Trạng thái chờ duyệt không đồng nghĩa với hàng đã xuất kho. Dữ liệu chỉ được cập nhật khi kết nối backend xử lý giao dịch thật.</div>`;
  openModal('Chi tiết phiếu xuất kho',o.id,body,`<button class="btn btn-secondary" data-action="close-modal">Đóng</button>`);
}
function stockDetail(id){const s=stock.find(x=>x.id===id);if(!s)return;const body=`<div class="detail-grid">${detailItem('Mã hàng',s.id)}${detailItem('Loại hàng',escapeHTML(s.kind))}${detailItem('Số lượng khả dụng',fmt(s.available)+' '+s.unit)}${detailItem('Mức cảnh báo tối thiểu',fmt(s.min)+' '+s.unit)}</div><div class="detail-section"><h3>Tên mặt hàng</h3><p>${escapeHTML(s.name)}</p></div><div class="inline-info" style="margin-top:18px;margin-bottom:0">${icon('info')} Nhân viên được tra cứu nhưng không có quyền sửa trực tiếp số lượng tồn kho.</div>`;openModal('Chi tiết tồn kho',s.id,body,`<button class="btn btn-secondary" data-action="close-modal">Đóng</button>`);}

// Delegated interactions — buttons and form elements function across page rerenders.
document.addEventListener('click',e=>{
  if(e.target.closest('#profileToggle')){const menu=document.getElementById('profileMenu');menu.classList.toggle('hidden');document.getElementById('profileToggle').setAttribute('aria-expanded',String(!menu.classList.contains('hidden')));return;}
  const menuToggle=e.target.closest('#menuToggle');
  if(menuToggle){
    const open=document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('mobileBackdrop').classList.toggle('show',open);
    menuToggle.setAttribute('aria-expanded',String(open));
    return;
  }
  if(e.target.id==='mobileBackdrop'){closeMobile();return;}
  if(e.target.id==='modalOverlay'){closeModal();return;}
  const orderFilter=e.target.closest('[data-order-filter]');
  if(orderFilter){setOrderFilter(state.filter===orderFilter.dataset.orderFilter?'all':orderFilter.dataset.orderFilter);return;}
  const tab=e.target.closest('[data-tab]');if(tab){setTab(tab.dataset.tab);return;}
  const nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return;}
  const button=e.target.closest('[data-action]');if(button){const id=button.dataset.id;switch(button.dataset.action){case 'close-modal':closeModal();break;case 'detail-request':requestDetail(id);break;case 'detail-order':orderDetail(id);break;case 'create-issue':issueModal(id);break;case 'create-document':documentModal(id);break;case 'detail-document':documentDetail(id);break;case 'detail-outbound':outboundDetail(id);break;case 'detail-stock':stockDetail(id);break;}return;}
  if(!e.target.closest('#profileMenu')){document.getElementById('profileMenu').classList.add('hidden');document.getElementById('profileToggle').setAttribute('aria-expanded','false');}
});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){state.search=e.target.value;updateVisibleTable();}});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-filter="orders"]')){setOrderFilter(e.target.value);return;}
  if(e.target.matches('[data-filter]')){state.filter=e.target.value;updateVisibleTable();}
  if(e.target.matches('#issueRequest')){
    const request=getRequest(e.target.value);
    if(!request)return;
    document.getElementById('issueProduct').value=request.product;
    document.getElementById('issueSku').value=request.sku;
    document.getElementById('issueAvail').value=fmt(request.stock)+' chiếc';
    const qty=document.getElementById('issueQty');
    qty.max=request.qty;
    qty.value=request.qty;
    document.querySelector('.modal-header p').textContent='Phân hệ kho · '+request.id;
  }
  if(e.target.matches('#docRequest')){
    document.querySelector('.modal-header p').textContent=e.target.value;
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='issueForm'){e.preventDefault();createIssue(e.target);}
  if(e.target.id==='documentForm'){e.preventDefault();createDocument(e.target);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMobile();document.getElementById('profileMenu').classList.add('hidden');}});

injectIcons();
render();
</script>
</body>
</html>
