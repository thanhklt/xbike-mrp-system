<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XBike MRP | Backend v4 prototype</title>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0b09;
    color: #f5f0eb;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: 16px;
    box-sizing: border-box;
  }

  #xbike-new {
    --xb-bg: #14110f;
    --xb-side: #1a1512;
    --xb-card: #1f1915;
    --xb-card-elevated: #27201b;
    --xb-hover: #2d251f;
    --xb-border: #362c24;
    --xb-border-strong: #4d3f34;

    --xb-text: #f5f0eb;
    --xb-text-sub: #b5a89c;
    --xb-text-muted: #85786c;

    --xb-orange: #c85214;
    --xb-orange-hover: #de5d19;
    --xb-orange-border: #f07b3a;

    --xb-green: #15803d;
    --xb-green-hover: #16a34a;
    --xb-green-border: #22c55e;

    --xb-amber: #b45309;
    --xb-amber-hover: #d97706;
    --xb-amber-border: #f59e0b;

    --xb-red: #b91c1c;
    --xb-red-hover: #dc2626;
    --xb-red-border: #ef4444;

    background: var(--xb-bg);
    border: 1px solid var(--xb-border);
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    overflow: hidden;
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--xb-text);
    max-width: 1440px;
    margin: 0 auto;
  }

  #xbike-new.xb-wide {
    max-width: 100%;
    border-radius: 10px;
  }

  #xbike-new * {
    box-sizing: border-box;
  }

  #xbike-new button,
  #xbike-new input,
  #xbike-new select,
  #xbike-new textarea {
    font: inherit;
    color: var(--xb-text);
  }

  /* Buttons */
  #xbike-new button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid var(--xb-border-strong);
    border-radius: 8px;
    background: #2a221c;
    color: #efe8e0;
    padding: 8px 13px;
    font-weight: 500;
    max-width: 100%;
    cursor: pointer;
    transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.1s ease, box-shadow 0.16s ease;
  }

  #xbike-new button:hover:not(:disabled) {
    background: #382d25;
    border-color: #695647;
  }

  #xbike-new button:active:not(:disabled) {
    transform: translateY(1px);
  }

  #xbike-new button:focus-visible,
  #xbike-new input:focus-visible,
  #xbike-new select:focus-visible,
  #xbike-new textarea:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(232, 111, 34, 0.28);
    border-color: var(--xb-orange-border);
  }

  #xbike-new button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  #xbike-new .xb-orange {
    background: var(--xb-orange);
    border-color: var(--xb-orange-border);
    color: #ffffff;
    box-shadow: 0 2px 10px rgba(200, 82, 20, 0.28);
  }
  #xbike-new .xb-orange:hover:not(:disabled) {
    background: var(--xb-orange-hover);
    border-color: #ff9457;
  }

  #xbike-new .xb-green {
    background: var(--xb-green);
    border-color: var(--xb-green-border);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(21, 128, 61, 0.24);
  }
  #xbike-new .xb-green:hover:not(:disabled) {
    background: var(--xb-green-hover);
    border-color: #4ade80;
  }

  #xbike-new .xb-amber {
    background: var(--xb-amber);
    border-color: var(--xb-amber-border);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(180, 83, 9, 0.26);
  }
  #xbike-new .xb-amber:hover:not(:disabled) {
    background: var(--xb-amber-hover);
    border-color: #fbbf24;
  }

  #xbike-new .xb-red {
    background: var(--xb-red);
    border-color: var(--xb-red-border);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(185, 28, 28, 0.24);
  }
  #xbike-new .xb-red:hover:not(:disabled) {
    background: var(--xb-red-hover);
    border-color: #f87171;
  }

  /* Form Controls */
  #xbike-new input,
  #xbike-new select,
  #xbike-new textarea {
    background: #15110e;
    border: 1px solid var(--xb-border-strong);
    border-radius: 8px;
    padding: 9px 12px;
    width: 100%;
    min-width: 0;
    color: var(--xb-text);
    transition: border-color 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
  }

  #xbike-new input:hover:not(:disabled),
  #xbike-new select:hover:not(:disabled),
  #xbike-new textarea:hover:not(:disabled) {
    border-color: #6b5849;
  }

  #xbike-new input::placeholder,
  #xbike-new textarea::placeholder {
    color: var(--xb-text-muted);
    opacity: 1;
  }

  #xbike-new select:disabled,
  #xbike-new input:disabled {
    background: #1b1613;
    color: var(--xb-text-muted);
    cursor: not-allowed;
  }

  #xbike-new select option {
    background: #1f1915;
    color: var(--xb-text);
  }

  #xbike-new label {
    display: grid;
    gap: 7px;
    min-width: 0;
    font-size: 13px;
    font-weight: 500;
    color: #dfd6cd;
  }

  /* Typography */
  #xbike-new h1 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: #ffffff;
    margin: 0 0 6px;
  }
  #xbike-new h2 {
    font-size: 16px;
    font-weight: 600;
    color: #f5f0eb;
    margin: 0 0 16px;
  }
  #xbike-new h3 {
    font-size: 14px;
    font-weight: 600;
    color: #e6ddd4;
    margin: 0 0 12px;
  }
  #xbike-new p {
    margin: 4px 0 14px;
    color: var(--xb-text-sub);
  }

  /* Layout Shell */
  #xbike-new .xb-shell {
    display: grid;
    grid-template-columns: 238px minmax(0, 1fr);
    min-height: 780px;
  }

  #xbike-new aside {
    background: var(--xb-side);
    border-right: 1px solid var(--xb-border);
    padding: 20px 14px;
  }

  #xbike-new .xb-logo {
    background: #1b1512;
    border: 1px solid var(--xb-border);
    border-radius: 10px;
    overflow: hidden;
    margin: 0 0 20px;
    padding: 4px;
  }

  #xbike-new .xb-logo canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 251/96;
    border-radius: 6px;
  }

  #xbike-new .xb-navgroup {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--xb-text-muted);
    margin: 20px 10px 8px;
  }

  #xbike-new .xb-nav button {
    display: flex;
    width: 100%;
    justify-content: flex-start;
    gap: 10px;
    align-items: center;
    text-align: left;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--xb-text-sub);
    font-weight: 500;
    padding: 10px 11px;
    margin: 3px 0;
  }

  #xbike-new .xb-nav button:hover {
    background: #251e19;
    color: var(--xb-text);
    border-color: transparent;
  }

  #xbike-new .xb-nav button.active {
    background: linear-gradient(90deg, rgba(200, 82, 20, 0.28) 0%, rgba(200, 82, 20, 0.1) 100%);
    border-color: rgba(240, 123, 58, 0.35);
    color: #ffffff;
    box-shadow: inset 3px 0 0 #ff8c42;
  }

  #xbike-new .xb-nav button.active svg {
    color: #ff944d;
  }

  #xbike-new .xb-nav svg {
    width: 17px;
    height: 17px;
    flex: none;
    color: var(--xb-text-muted);
    transition: color 0.16s ease;
  }

  #xbike-new .xb-nav button:hover svg {
    color: var(--xb-text);
  }

  #xbike-new .xb-body {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  #xbike-new header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    padding: 16px 26px;
    background: rgba(26, 21, 18, 0.75);
    border-bottom: 1px solid var(--xb-border);
  }

  #xbike-new header strong {
    color: #ffffff;
    font-size: 15px;
  }

  #xbike-new .xb-small {
    font-size: 12px;
    color: var(--xb-text-sub);
  }

  #xbike-new .xb-avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c85214, #88360b);
    border: 1px solid rgba(255, 160, 102, 0.35);
    color: #ffffff;
    font-size: 12px;
    font-weight: 600;
  }

  #xbike-new .xb-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  #xbike-new main {
    padding: 26px;
    min-width: 0;
    flex: 1;
  }

  #xbike-new .xb-kicker {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #f08843;
    margin-bottom: 8px;
  }

  #xbike-new .xb-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  #xbike-new .xb-heading p {
    margin: 6px 0 0;
    color: var(--xb-text-sub);
  }

  #xbike-new .xb-panel {
    background: var(--xb-card);
    border: 1px solid var(--xb-border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    min-width: 0;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
  }

  /* Toolbar */
  #xbike-new .xb-toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin: 18px 0;
  }
  #xbike-new .xb-toolbar input {
    flex: 1;
    min-width: 200px;
  }
  #xbike-new .xb-toolbar select {
    width: auto;
    min-width: 185px;
  }

  /* Tables */
  #xbike-new .xb-table {
    overflow-x: auto;
    border: 1px solid var(--xb-border);
    border-radius: 10px;
    background: var(--xb-card);
  }

  #xbike-new table {
    border-collapse: collapse;
    width: 100%;
    text-align: left;
  }

  #xbike-new th {
    background: var(--xb-card-elevated);
    color: #cfc3b6;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 13px 14px;
    border-bottom: 1px solid var(--xb-border-strong);
    white-space: nowrap;
  }

  #xbike-new td {
    padding: 14px;
    border-bottom: 1px solid #2e251f;
    vertical-align: middle;
    overflow-wrap: anywhere;
    color: var(--xb-text);
  }

  #xbike-new tbody tr:last-child td {
    border-bottom: 0;
  }

  #xbike-new tbody tr {
    transition: background-color 0.14s ease;
  }

  #xbike-new tbody tr:hover {
    background: rgba(255, 245, 235, 0.03);
  }

  #xbike-new td small {
    display: block;
    font-size: 12px;
    color: var(--xb-text-sub);
    margin-top: 4px;
  }

  #xbike-new td button {
    font-size: 12px;
    padding: 6px 11px;
    border-radius: 7px;
  }

  #xbike-new .xb-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  /* Semantic Status Badges */
  #xbike-new .xb-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    background: rgba(168, 162, 158, 0.14);
    border: 1px solid rgba(168, 162, 158, 0.3);
    color: #d6d3d1;
    white-space: nowrap;
  }

  #xbike-new .xb-badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex: none;
  }

  #xbike-new .xb-badge.green {
    background: rgba(34, 197, 94, 0.14);
    border-color: rgba(34, 197, 94, 0.36);
    color: #4ade80;
  }

  #xbike-new .xb-badge.blue {
    background: rgba(56, 189, 248, 0.14);
    border-color: rgba(56, 189, 248, 0.36);
    color: #38bdf8;
  }

  #xbike-new .xb-badge.orange {
    background: rgba(245, 158, 11, 0.15);
    border-color: rgba(245, 158, 11, 0.38);
    color: #fbbf24;
  }

  #xbike-new .xb-badge.red {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.38);
    color: #f87171;
  }

  #xbike-new .xb-empty {
    text-align: center;
    padding: 36px 20px;
    color: var(--xb-text-muted);
  }

  /* Dashboard Stats & Charts */
  #xbike-new .xb-stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }

  #xbike-new .xb-stats .xb-panel {
    position: relative;
    overflow: hidden;
    transition: transform 0.16s ease, border-color 0.16s ease;
  }

  #xbike-new .xb-stats .xb-panel:hover {
    transform: translateY(-2px);
    border-color: #544336;
  }

  #xbike-new .xb-stats .xb-panel::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #e86f22, #f59e0b);
    opacity: 0.85;
  }

  #xbike-new .xb-stats .xb-panel:nth-child(2)::before {
    background: linear-gradient(90deg, #16a34a, #4ade80);
  }

  #xbike-new .xb-stats .xb-panel:nth-child(3)::before {
    background: linear-gradient(90deg, #0284c7, #38bdf8);
  }

  #xbike-new .xb-stats .xb-panel > div:first-child {
    font-size: 13px;
    font-weight: 500;
    color: var(--xb-text-sub);
  }

  #xbike-new .xb-number {
    font-size: 32px;
    font-weight: 700;
    color: #ffffff;
    margin: 10px 0 14px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  #xbike-new .xb-charts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  #xbike-new .xb-chart-button {
    display: block;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 10px 10px;
    width: 100%;
    text-align: left;
    margin: 6px 0;
  }

  #xbike-new .xb-chart-button:hover {
    background: var(--xb-hover);
    border-color: var(--xb-border);
  }

  #xbike-new .xb-chart-label {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }

  #xbike-new .xb-chart-label span:first-child {
    color: var(--xb-text);
    font-weight: 500;
  }

  #xbike-new .xb-chart-label span:last-child {
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    color: var(--xb-text-sub);
    font-weight: 600;
  }

  #xbike-new .xb-track {
    display: block;
    height: 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  #xbike-new .xb-bar {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #d9621a, #f59e0b);
    transition: width 0.3s ease;
  }

  #xbike-new .xb-axis {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 11px;
    color: var(--xb-text-muted);
    border-top: 1px solid var(--xb-border);
    margin-top: 14px;
    padding-top: 8px;
  }

  /* Alerts & Notices */
  #xbike-new .xb-note {
    background: rgba(232, 111, 34, 0.09);
    border: 1px solid rgba(232, 111, 34, 0.25);
    border-left: 3px solid #f07b3a;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 18px;
    color: #e6d7ca;
    font-size: 13px;
  }

  #xbike-new .xb-notice {
    padding: 12px 26px;
    background: rgba(21, 128, 61, 0.22);
    border-bottom: 1px solid rgba(34, 197, 94, 0.35);
    color: #86efac;
    font-weight: 500;
  }

  #xbike-new .xb-error {
    background: rgba(185, 28, 28, 0.22);
    border: 1px solid rgba(239, 68, 68, 0.4);
    border-left: 3px solid #ef4444;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 18px;
    color: #fca5a5;
    font-weight: 500;
  }

  /* Tabs & Breadcrumb */
  #xbike-new .xb-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  #xbike-new .xb-breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--xb-text-sub);
    margin-bottom: 12px;
  }

  #xbike-new .xb-breadcrumb .xb-badge {
    margin-left: auto;
  }

  /* Detail & Form Layouts */
  #xbike-new .xb-doc-actions {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin: 18px 0 24px;
  }

  #xbike-new .xb-doc-layout {
    display: grid;
    grid-template-columns: minmax(210px, 0.78fr) minmax(0, 1.62fr);
    gap: 22px;
    align-items: start;
  }

  #xbike-new .xb-identity {
    text-align: center;
    padding: 6px 0 22px;
    border-bottom: 1px solid var(--xb-border);
    margin-bottom: 20px;
  }

  #xbike-new .xb-identity h2 {
    overflow-wrap: anywhere;
    margin-bottom: 10px;
    font-size: 18px;
    color: #ffffff;
  }

  #xbike-new .xb-doc-icon {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(200, 82, 20, 0.25), rgba(200, 82, 20, 0.08));
    border: 1px solid rgba(240, 123, 58, 0.4);
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 16px;
    color: #ff944d;
  }

  #xbike-new .xb-doc-icon svg {
    width: 28px;
    height: 28px;
  }

  #xbike-new .xb-datum {
    margin: 0 0 16px;
    overflow-wrap: anywhere;
    color: var(--xb-text);
    font-weight: 500;
  }

  #xbike-new .xb-datum > span {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: var(--xb-text-muted);
    margin-bottom: 4px;
  }

  #xbike-new .xb-fields {
    display: grid;
    gap: 16px;
  }

  #xbike-new .xb-readvalue {
    padding: 8px 0 10px;
    border-bottom: 1px solid var(--xb-border);
    min-height: 36px;
    overflow-wrap: anywhere;
    color: var(--xb-text);
  }

  #xbike-new .xb-field-label {
    font-size: 12px;
    color: var(--xb-text-muted);
    margin-bottom: 4px;
  }

  #xbike-new .xb-foot {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    flex-wrap: wrap;
    margin: 20px 0 0;
  }

  #xbike-new .xb-line-select {
    min-width: 190px;
  }
  #xbike-new .xb-line-qty {
    min-width: 90px;
  }

  /* Modal Overlay */
  #xbike-new .xb-app {
    position: relative;
  }

  #xbike-new .xb-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 8, 6, 0.78);
    backdrop-filter: blur(4px);
    z-index: 50;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px;
    overflow-y: auto;
  }

  #xbike-new .xb-modal {
    width: 560px;
    max-width: 100%;
    background: #241d18;
    border: 1px solid var(--xb-border-strong);
    border-radius: 14px;
    padding: 24px;
    margin-top: 48px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
  }

  #xbike-new .xb-modal .xb-table {
    margin: 16px 0;
  }

  #xbike-new .xb-modal-error {
    background: rgba(185, 28, 28, 0.25);
    border: 1px solid rgba(239, 68, 68, 0.45);
    color: #fca5a5;
    border-radius: 8px;
    margin-top: 12px;
    padding: 10px 12px;
    font-size: 13px;
  }

  #xbike-new.xb-wide .xb-shell {
    grid-template-columns: 215px minmax(0, 1fr);
  }
  #xbike-new.xb-wide main {
    padding: 20px;
  }

  @media (max-width: 960px) {
    #xbike-new .xb-charts {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 760px) {
    body {
      padding: 0;
    }
    #xbike-new {
      border-radius: 0;
      border: 0;
    }

  function validateLines(lines,prices=false) {

  function checkPlan(r) {

    return {first,use,produce,demand: demand.map(l=>({...l,available:available(l.item),missing:Math.max(0,l.qty-available(l.item))}))};
  }

      const n=id('boms'),b={id:n,code:code('BOM',n),product:Number(d.product),version:Math.max(...db.boms.filter(b=>b.product===Number(d.product)).map(b=>b.version))+1,lines:d.lines,active:true,rev:1};

      if(e.kind==='item'&&d.type==='thanh_pham'){const bId=id('boms'),b={id:bId,code:code('BOM',bId),product:n,version:1,active:true,lines:d.lines.map(l=>({item:Number(l.item),qty:Number(l.qty)})),rev:1};created.lastBom=bId;db.boms.push(b);audit('Tạo BOM đầu tiên',b.code,null,b);}

    else if(name==='preview-check'){
      const r=request(key);requireCheck(r);const p=checkPlan(r),rev=r.rev;
      return openModal('Xem trước kiểm tra '+r.code,`<div class="xb-summary">${datum('Dùng TP sẵn có',number(p.use))}${datum('Cần sản xuất',number(p.produce))}</div>${table(['Linh kiện','Cần','Khả dụng','Thiếu'],p.demand.map(l=>[esc(itemName(l.item)),number(l.qty),number(l.available),number(l.missing)]))}${note('Xem trước không giữ hàng hoặc ghi lịch sử. Xác nhận sẽ tính lại theo số liệu hiện tại; nếu thiếu thì không giữ một phần linh kiện.')}`,()=>{const current=request(key);assertVersion(current,rev);checkRequest(current);},'Xác nhận kiểm tra & giữ hàng');
    }
    else if(name==='cancel-request'){
      const r=request(key);ensure(isQ(),'Chỉ QLK hủy yêu cầu.');const approved=db.issues.some(d=>d.request===r.id&&d.status==='da_duyet');
      if(approved)return openModal('Không thể hủy '+r.code,note('Đã có phiếu xuất được duyệt. Hủy bị chặn để bảo vệ chứng từ và sổ kho.'));
      return confirmDoc('requests',key,'Xem trước hủy '+r.code,'Sẽ giải phóng giữ hàng, xóa phiếu xuất nháp và từ chối phiếu chờ duyệt. Không thay đổi tồn thực tế.',cancelRequest,true);
    }
    else if(name==='start-request')return confirmDoc('requests',key,'Bắt đầu sản xuất?','Cần phiếu xuất linh kiện đã được duyệt. Bắt đầu chỉ ghi thời điểm, không trừ kho lần nữa.',r=>{ensure(own(r)&&r.status==='dang_thuc_hien'&&r.produce>0,'Không thể bắt đầu yêu cầu này.');ensure(db.issues.some(d=>d.request===r.id&&d.kind==='xuat_linh_kien'&&d.status==='da_duyet'),'Phiếu xuất linh kiện chưa được duyệt.');if(!r.startedAt)change(r,()=>{r.startedAt=stamp();},'Bắt đầu sản xuất');notice='Đã bắt đầu sản xuất; trạng thái vẫn Đang thực hiện. Không thay đổi tồn.';});
    else if(name==='create-lk'||name==='create-tp') {const r=request(key),kind=name==='create-lk'?'xuat_linh_kien':'xuat_thanh_pham';requireIssue(r,kind);return confirmDoc('requests',key,'Lập phiếu '+typeNames[kind].toLowerCase()+'?','Hệ thống lấy đúng số lượng đã chốt; chưa trừ tồn và chưa chốt giá.',r=>createIssue(r,kind));}
    else if(name==='create-completion')return confirmDoc('requests',key,'Lập chứng từ hoàn thành?','Hệ thống lấy toàn bộ lượng cần sản xuất đã chốt. Không nhập số lượng hoàn thành một phần.',createCompletion);
    else if(name==='send-issue')return confirmDoc('issues',key,'Gửi phiếu xuất duyệt?','Chưa trừ tồn. Nếu bị từ chối sẽ gửi lại cùng phiếu.',d=>sendDoc('issues',d));
    else if(name==='send-completion')return confirmDoc('completions',key,'Gửi chứng từ hoàn thành?','Ghi thời điểm hoàn thành và chờ QLK duyệt; chưa cộng thành phẩm.',d=>sendDoc('completions',d));
    else if(name==='approve-issue')return confirmDoc('issues',key,'Duyệt phiếu xuất?','Trừ tồn, tiêu thụ giữ hàng, chốt giá và ghi sổ cùng nhau. Không thể sửa phiếu đã duyệt.',approveIssue);
    else if(name==='approve-completion')return confirmDoc('completions',key,'Duyệt chứng từ hoàn thành?','Cộng đúng lượng thành phẩm và ghi sổ; yêu cầu nhập kho hoàn thành, xuất giao tiếp tục chờ xuất TP.',approveCompletion);
    else if(name==='reject-issue'||name==='reject-completion') {const collection=name==='reject-issue'?'issues':'completions';return confirmDoc(collection,key,'Từ chối chứng từ?','Giữ nguyên tồn và giữ hàng. Nhân viên được giao có thể gửi lại chính chứng từ này.',(d,reason)=>{ensure(isQ()&&d.status==='cho_duyet','Chỉ QLK từ chối phiếu chờ duyệt.');change(d,()=>{d.status='tu_choi';d.reason=reason;},'Từ chối chứng từ',reason);notice='Đã từ chối. Tồn kho chưa thay đổi.';},true);}
    else if(name==='item-toggle')return confirmDoc('items',key,item(key).active?'Ngừng sử dụng mặt hàng?':'Dùng lại mặt hàng?','Không xóa số dư. Với thành phẩm, BOM đang dùng sẽ được dừng hoặc phiên bản gần nhất được dùng lại.',i=>{
      ensure(isQ(),'Chỉ QLK quản lý mặt hàng.');if(!i.active&&i.type==='thanh_pham'){const b=db.boms.find(b=>b.id===i.lastBom)||db.boms.filter(b=>b.product===i.id).sort((a,b)=>b.version-a.version)[0];ensure(b,'Thành phẩm chưa có BOM.');validateLines(b.lines);b.active=true;b.rev++;i.lastBom=b.id;}
      change(i,()=>{i.active=!i.active;},i.active?'Ngừng mặt hàng':'Dùng lại mặt hàng');if(!i.active&&i.type==='thanh_pham')for(const b of db.boms.filter(b=>b.product===i.id&&b.active)){b.active=false;b.rev++;}notice='Đã cập nhật trạng thái mặt hàng. Số dư giữ nguyên.';
    });
    else if(name==='bom-toggle')return confirmDoc('boms',key,'Đổi trạng thái BOM?','Dừng BOM đang dùng sẽ ngừng thành phẩm. Dùng lại sẽ kiểm tra linh kiện và thay phiên bản hiện hành.',b=>{ensure(isQ(),'Chỉ QLK quản lý BOM.');if(b.active){change(b,()=>{b.active=false;},'Dừng BOM');item(b.product).active=false;item(b.product).lastBom=b.id;}else{validateLines(b.lines);for(const old of db.boms.filter(x=>x.product===b.product&&x.active)){old.active=false;old.rev++;}change(b,()=>{b.active=true;},'Dùng lại BOM');item(b.product).active=true;item(b.product).lastBom=b.id;}notice='Đã cập nhật BOM. Yêu cầu đã gửi giữ nguyên phiên bản đã chốt.';});
    else if(name==='open-audit'){ensure(isQ()||user().role==='quan_tri_vien','Không được xem lịch sử.');const l=getDoc('logs',key);return openModal('Lịch sử · '+l.object,`${datum('Thao tác',esc(l.action))}${datum('Người thực hiện',esc(person(l.actor)?.name))}${datum('Thời điểm',dateTime(l.at))}${l.reason?datum('Lý do',esc(l.reason)):''}<h3>Trước</h3><pre>${esc(JSON.stringify(l.before,null,2))}</pre><h3>Sau</h3><pre>${esc(JSON.stringify(l.after,null,2))}</pre>`);}
    else if(name==='legacy')return openModal('Ticket / điều chỉnh lịch sử',note('Chỉ giữ lối xem lịch sử từ prototype cũ. Backend còn route chuyển tiếp nhưng schema bootstrap v4 hiện không có bảng ticket/điều chỉnh tương ứng; bản này không mô phỏng tạo, nhận xử lý hoặc giải quyết thành công.')+table(['Mã mẫu cũ','Phiếu nhập','Trạng thái'],[['TK-001','PN-LS01','Đã đóng (minh họa lịch sử)']]));
    else if(name==='guide')return openModal('Hướng dẫn thử luồng',`<ol><li><strong>Xuất từ tồn:</strong> QLK gửi YCSX-000001 → Nam kiểm tra và giữ TP → lập/gửi PX thành phẩm → QLK duyệt.</li><li><strong>Thiếu linh kiện:</strong> QLK gửi YCSX-000002 → Hà kiểm tra (thiếu bánh xe) → QLK hoàn tất PN-000002 → Hà kiểm tra lại, lập/gửi PX linh kiện → QLK duyệt → Hà bắt đầu, lập/gửi HTSX → QLK duyệt.</li><li><strong>Duyệt có sẵn:</strong> QLK mở PX-000002 hoặc HTSX-000001 để thử ghi sổ. Bấm Kiểm tra ghi nhận để kiểm chứng không ghi hai lần.</li><li><strong>BOM:</strong> tạo phiên bản mới, xem yêu cầu đã gửi vẫn giữ BOM cũ.</li><li><strong>Hủy:</strong> chỉ hủy được khi chưa có phiếu xuất đã duyệt; giữ hàng được giải phóng.</li></ol>${note('Tất cả tài khoản, mã và dữ liệu đều mô phỏng. Chuyển vai trò không phải chức năng đăng nhập thật. Bản này chỉ bao phủ các màn có trong prototype và các bước phụ thuộc, không phải toàn bộ hệ thống.')}`);
    else if(name==='close-modal')return closeModal();
    else if(name==='confirm-modal') {
      ensure(modal?.confirm,'Không có thao tác cần xác nhận.');const previous=copy(db);try{modal.confirm();modal=null;error='';}catch(e){db=previous;modal.error=e.message;render();return;}
    }
    render();
  }
  root.addEventListener('click',event=>{const el=event.target.closest('button[data-action]');if(!el)return;try{action(el.dataset.action,el.dataset.key);}catch(e){error=e.message;render();root.querySelector('.xb-error')?.focus();}});
  root.addEventListener('submit',event=>{if(event.target.hasAttribute('data-reference-filter')){event.preventDefault();filters.page=1;render();(root.querySelector('.xb-reference-error')||root.querySelector('.xb-reference-results'))?.focus();return;}if(event.target.id==='xb-movements-filter-form'){event.preventDefault();filters.page=1;render();root.querySelector('.xb-movements-results')?.focus();return;}if(event.target.id==='xb-receipts-filter-form'){event.preventDefault();filters.page=1;render();root.querySelector('.xb-receipts-results')?.focus();return;}if(event.target.id==='xb-items-filter-form'){event.preventDefault();filters.page=1;render();root.querySelector('.xb-items-results')?.focus();return;}if(event.target.id==='xb-overview-stock-form'){event.preventDefault();filters.q=overviewSearch.trim();render();root.querySelector('.xb-overview-results-summary')?.focus();return;}if(event.target.id!=='xb-editor-form')return;event.preventDefault();const previous=copy(db);try{saveEditor();}catch(e){db=previous;error=e.message;render();root.querySelector('.xb-error')?.focus();}});
  root.addEventListener('input',event=>{
    const el=event.target;if(el.dataset.editor&&editor)editor.data[el.dataset.editor]=el.value;
    if(el.hasAttribute('data-overview-search'))overviewSearch=el.value;
    if(el.dataset.line&&editor){const [n,key]=el.dataset.line.split(':');editor.data.lines[Number(n)][key]=el.value;}
    if(el.hasAttribute('data-modal-reason')&&modal)modal.text=el.value;
    if(el.dataset.filter&&el.tagName==='INPUT'){
      const key=el.dataset.filter,start=el.selectionStart;filters[key]=el.value;filters.page=1;render();const next=root.querySelector(`[data-filter="${key}"]`);next?.focus();if(next&&start!=null&&['search','text'].includes(next.type))next.setSelectionRange(start,start);
    }
  });
  root.addEventListener('change',event=>{
    const el=event.target;
    if(el.dataset.session==='actor') {actor=Number(el.value);ensure(person(actor),'Vai trò không hợp lệ.');modal=null;editor=null;navigate('overview');notice='Đang mô phỏng '+roles[user().role]+' · '+user().name;render();}
    else if(el.dataset.filter&&el.tagName==='SELECT'){filters[el.dataset.filter]=el.value;filters.page=1;if(el.dataset.filter==='period')filters.part='1';render();}
    else if(el.dataset.editor&&editor){editor.data[el.dataset.editor]=el.value;if(el.dataset.editor==='type')render();}
    else if(el.dataset.line&&editor){const [n,key]=el.dataset.line.split(':');editor.data.lines[Number(n)][key]=el.value;}
  });
  root.addEventListener('keydown',event=>{
    if(!modal){
      if(event.target.closest('#xb-account-trigger')&&['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();setAccountMenu(true);const items=[...root.querySelectorAll('#xb-account-menu [role="menuitem"]')];(event.key==='ArrowUp'?items.at(-1):items[0])?.focus();return;}
      if(accountMenuOpen){
        if(event.key==='Escape'){event.preventDefault();setAccountMenu(false,true);return;}
        if(event.key==='Tab'){setAccountMenu(false,true);return;}
        if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){event.preventDefault();const items=[...root.querySelectorAll('#xb-account-menu [role="menuitem"]')],current=items.indexOf(document.activeElement);const next=event.key==='Home'?0:event.key==='End'?items.length-1:(current+(event.key==='ArrowDown'?1:-1)+items.length)%items.length;items[next]?.focus();return;}
      }
    }
    if(!modal)return;if(event.key==='Escape'){event.preventDefault();closeModal();return;}
    if(event.key==='Tab'){const focusable=[...root.querySelectorAll('.xb-modal button,.xb-modal textarea,.xb-modal input,.xb-modal select,.xb-modal a[href]')].filter(el=>!el.disabled);const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
  });
  document.addEventListener('click',event=>{if(accountMenuOpen&&!event.target.closest('.xb-account'))setAccountMenu(false);});
  seed();render();
})();
</script>
</body>
</html>
