name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "infra/postgres/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "infra/postgres/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-checks:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xbike_test
          POSTGRES_PASSWORD: xbike_test_password
          POSTGRES_DB: xbike_mrp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install "poetry==2.4.1"

      - name: Cache Poetry environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py311-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: |
          poetry check --lock
          poetry sync --with dev --no-interaction

      - name: Bootstrap test database from SQL
        env:
          PGPASSWORD: xbike_test_password
        run: |
          psql -h localhost -U xbike_test -d xbike_mrp_test -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
          psql -h localhost -U xbike_test -d xbike_mrp_test -v ON_ERROR_STOP=1 -f infra/postgres/seed.sql

      - name: Run Ruff Linter & Formatter Check
        working-directory: ./backend
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Run Pytest Test Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://xbike_test:xbike_test_password@localhost:5432/xbike_mrp_test
          TEST_DATABASE_URL: postgresql+asyncpg://xbike_test:xbike_test_password@localhost:5432/xbike_mrp_test
          SECRET_KEY: test-secret-key-for-github-actions-continuous-integration-run
          ENVIRONMENT: test
        run: |
          poetry run pytest -v
